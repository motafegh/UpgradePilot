name: Cycle 3 Stage 1 provider proof

on:
  push:
    branches:
      - agent/cycle3-stage1-provider-proof

permissions:
  contents: read

jobs:
  provider-proof:
    name: Focused workflow command analysis proof
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out proof revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install UpgradePilot with pinned parser dependencies
        run: python -m pip install .

      - name: Run focused provider proof
        run: python -m unittest tests.test_github_workflow_command_analysis -v
