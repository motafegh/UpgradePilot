name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install .

      - name: Compile source and tests
        run: python -m compileall -q src tests

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Exercise bootstrap CLI
        run: |
          upgradepilot validate examples/pydantic-13432.bootstrap.json
          upgradepilot analyze examples/pydantic-13432.bootstrap.json --output-dir "${RUNNER_TEMP}/upgradepilot-report"
