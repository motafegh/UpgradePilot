[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "upgradepilot"
version = "0.0.0"
description = "Evidence-backed dependency-update decision support for public Python repositories"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32,<3",
    "packaging>=26.2,<27",
    "PyYAML>=6.0.3,<7",
]

[project.scripts]
upgradepilot = "upgradepilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]