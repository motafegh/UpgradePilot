[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "upgradepilot"
version = "0.0.0"
description = "Evidence-backed dependency-update decision support for public Python repositories"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32,<3",
    "packaging>=26.2,<27",
    "PyYAML>=6.0.3,<7",
    # These parser/grammar versions are characterized as one CST-compatibility set.
    # Upgrade them through the retained shell-grammar characterization probe.
    "tree-sitter==0.25.0",
    "tree-sitter-bash==0.25.1",
    "tree-sitter-pwsh==0.38.1",
    "tree-sitter-batch==0.11.1",
]

[dependency-groups]
experiments = [
    "langgraph==1.2.11",
]

[project.scripts]
upgradepilot = "upgradepilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
